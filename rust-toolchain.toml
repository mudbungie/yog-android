# Pinned toolchain — the same pin on every box and in CI, or gate verdicts and
# coverage floors silently stop meaning the same thing. Bump only as a
# deliberate, isolated change (and in lockstep with yog's pin where possible:
# the two repos share the gate design).
[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]
# The APK's ABIs, one per member of the device matrix. arm64 is the phone;
# x86_64 is the emulator the enrollment stories are driven through, added
# when that device came to exist rather than speculatively. The Makefile's
# `ABIS` selects which of these a given build cross-compiles.
targets = ["aarch64-linux-android", "x86_64-linux-android"]
