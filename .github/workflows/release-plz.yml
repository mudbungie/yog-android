name: Release-plz

# **The phone's release channel, publishing half** (bl-7a68, DESIGN §20).
# Build-gated and hands-off: a push to `main` runs the gate, keeps the release
# PR fresh, and releases any version in the manifest that has no tag yet —
# tagging it `v<version>`, cutting a GitHub Release, and attaching the
# release-signed APK to it. That asset IS the channel: the app reads
# `GET /repos/<owner>/<repo>/releases/latest` and finds it by its `.apk`
# suffix.
#
# **NOTHING HERE PUBLISHES TO A REGISTRY.** `Cargo.toml` carries
# `publish = false` — the deliverable is an APK, not a crate — so release-plz
# skips the registry step and determines the last released version from the git
# tag instead. That also means none of the crates.io machinery the sibling
# repositories carry belongs here: no trusted publisher to register, no
# `id-token: write`, no `CARGO_REGISTRY_TOKEN`, and no constraint on this
# file's NAME (crates.io matches a workflow filename against its publisher
# claim; nothing does here).
#
# THE JOBS, and what each is for.
#
#   * ci — the whole CI workflow, executed HERE via
#     `uses: ./.github/workflows/ci.yml` (a `workflow_call`), never observed
#     from a distance. A called workflow runs inside THIS run, so the release
#     job can hard-gate on it through `needs:` rather than watching a
#     `workflow_run` and hoping. `ci.yml` has no push arm of its own, so a push
#     to `main` runs the gate exactly once — here.
#   * release-plz PR (push to `main` only) — opens or refreshes ONE "release
#     PR" that bumps the version in `Cargo.toml`/`Cargo.lock` and nothing else
#     (`changelog_update = false` in `release-plz.toml`, with the reason). It
#     never releases; `merge-release-pr` below merges it. It does not wait on
#     `ci` — it touches nothing the gate protects, and a red tree should still
#     be able to show what the next version would be.
#   * release (`needs: ci`) — tags `v<version>` and cuts the GitHub Release,
#     for any manifest version no tag yet names. Behind the gate, so a release
#     only ever ships a GREEN tree. **It is this workflow's own `gh release
#     create` rather than release-plz** (bl-abe9): release-plz drops a
#     `publish = false` crate before it consults anything else, so it answered
#     `nothing to release` on every push and the channel published nothing
#     after 0.0.1. The step carries the measurement.
#   * release-apk (`needs: release-plz-release`) — builds the signed APK for
#     the tag that job just cut and attaches it. It is `apk.yml` with a `tag`,
#     the same workflow `ci.yml`'s android leg spends unsigned, so the artifact
#     a phone installs is assembled the way every CI build is assembled.
#     **It runs only when a release was actually created**, which is what the
#     `releases_created` output is read for: most pushes to `main` release
#     nothing, and a job that built and signed an APK on every one of them
#     would have nowhere to put it.
#   * merge-release-pr (`needs: ci, release-plz-pr, release-plz-release`) —
#     merges the release PR this run just refreshed, then dispatches this
#     workflow again so the merged bump is the one that releases. It runs on a
#     `workflow_dispatch` as well as on a push, which is the door for
#     re-judging a release the protocol gate is holding. See AUTO-MERGE below.
#   * prune-release-branches (right after the PR job) — deletes every
#     `release-plz-*` branch with no open PR. release-plz pushes a NEW
#     timestamped branch each time it refreshes the release PR, and pushes it
#     BEFORE opening the PR, so superseded and orphaned branches pile up one per
#     push to `main`; the repository's "automatically delete head branches"
#     setting only fires on MERGE and never sees them. It runs when that job
#     FAILED as well as when it succeeded, because the branch is pushed before
#     the PR is opened and a failure there is precisely how a branch is left
#     with nothing to close it — see the job's own condition.
#
# ONE-TIME SETUP THAT IS NOT IN THIS TREE, and no edit here can perform any of
# it:
#   * The two repository secrets the signing step reads —
#     `ANDROID_RELEASE_KEYSTORE` (the permanent keystore, base64) and
#     `ANDROID_RELEASE_KEYSTORE_PASSWORD`. Without them `release-apk` fails
#     loudly, which is the correct direction: a release with no APK asset is a
#     release the phone cannot see.
#   * Settings -> Actions -> General -> "Allow GitHub Actions to create and
#     approve pull requests", or the release-PR job 403s. Same page: Workflow
#     permissions set to "Read and write permissions".
#   * RELEASE_PLZ_TOKEN is OPTIONAL — a fine-grained PAT (contents +
#     pull-requests write) so the release PR's own commits re-trigger CI, which
#     the default token cannot do for its own pushes. The PR job falls back to
#     `GITHUB_TOKEN` when it is unset.
#
# ---------------------------------------------------------------------------
# AUTO-MERGE, AND WHY IT IS A JOB IN THIS FILE
#
# Merging the release PR is not a human control point (operator ruling
# 2026-09-03, adopted across the suite): the decision it asks for was already
# made by the work that landed on `main`, and the release is gated AFTER the
# merge by `release-plz-release`'s own `needs: ci`, so a red tree bumps a
# version on `main` and ships nothing. Holding the PR open bought nothing and
# cost every release a hand.
#
# WHAT "GREEN" MEANS HERE — this run's own `ci` job, reached through `needs:`.
# That is the exact job `release-plz-release` gates on, so the merge gate and
# the release gate cannot disagree, and it is deliberately NOT the release PR's
# own checks: a `pull_request` run on a `release-plz-*` head is created
# `action_required` in repositories configured like this one and may never
# start, so a merge gated on it would merge nothing, forever.
#
# `ci` judges THIS run's commit, and the release PR is a bump on top of exactly
# that commit: release-plz rebases the release branch onto `main` on every push
# here, so the PR head's first parent is `github.sha`. Guard 5 tests that
# identity rather than assuming it, so what is merged can only ever be the tree
# `ci` just passed plus the version bump.
#
# WHICH TOKEN MERGES, AND WHY THE DISPATCH IS NOT OPTIONAL. `GITHUB_TOKEN`,
# because there is no other token here. That makes the merge's push to `main`
# fire NOTHING — GitHub, verbatim: "with the exception of `workflow_dispatch`
# and `repository_dispatch`, other GITHUB_TOKEN triggered events do not create
# workflow runs" — so a merge on its own would leave the bump on `main`,
# unreleased, until some unrelated push happened by. The same sentence names
# the way out, and the job takes it: after the merge it dispatches THIS
# workflow on `main`. That is not a second door into the release path.
# `workflow_dispatch` is already one of this file's two triggers, the release
# job's `needs: ci` does not vary by trigger, and the dispatched run therefore
# re-runs the whole gate on the merged tree before releasing anything.
#
# The dispatched run DOES re-enter this job, and finds nothing to do. It used
# to be unreachable — `release-plz-pr` is push-only, so a bare `needs` on it
# skipped this job on every dispatch — and that unreachability was the
# recursion stop AND the defect (bl-de23): see A DISPATCH IS THE RE-JUDGE DOOR
# below. The loop is bounded by the work instead of by the wiring: a dispatched
# run refreshes no pull request and opens no second one, and the merge step
# dispatches only when it actually merged something. One dispatch, one pass,
# and no second merge to make.
#
# ---------------------------------------------------------------------------
# A DISPATCH IS THE RE-JUDGE DOOR (bl-de23)
#
# Guard 6 below is the only guard whose answer can change with nothing in this
# repository changing: a held release clears when the ENGINE publishes, which
# is an event this repository never sees. So a hand needs a way to ask again,
# and `workflow_dispatch` is it — the same door yog's `release-automerge.yml`
# names in the comment it leaves on a held pull request.
#
# It was nailed shut. Measured 2026-09-06: yog published v0.0.53 at PROTOCOL
# 18, this repository's release pull request for 0.0.4 stood open and clean,
# and a dispatch of this workflow skipped the merge job outright — so the
# release waited on an unrelated landing on `main` rather than on the condition
# it was actually held by.
#
# The job therefore names its dependencies' RESULTS instead of inheriting an
# implicit `success()` from `needs`. The gate does not move: `ci` and
# `release-plz-release` must have SUCCEEDED on either trigger. Only
# `release-plz-pr` may be `skipped`, which is exactly what a dispatch does to
# it and nothing else does — a FAILED PR job still skips this one.
#
# Guard 5 holds on a dispatch exactly as it does on a push: release-plz rebases
# the release branch onto `main` on every push here, so the head's first parent
# is `main`'s tip, and `github.sha` for a dispatch on `main` is that same tip.
#
# The dependency on `release-plz-release` is not ordering decoration either.
# That job checks out the `main` BRANCH rather than this run's sha, so a merge
# landing while it runs would hand it a tree nothing gated. Merging strictly
# after it removes the race.
#
# THE GUARDS, six of them, and none is the check rollup:
#   1. The head branch is release-plz's own timestamped shape, anchored end to
#      end — `release-plz-YYYY-MM-DDTHH-MM-SSZ`.
#   2. The author is the Actions bot (the `GITHUB_TOKEN` fallback's identity)
#      or the repository owner (a PAT's identity, so the guard survives one
#      being added later).
#   3. Every changed file is `Cargo.toml` or `Cargo.lock`, and there is at
#      least one. That is what a release PR IS here — a structural test no
#      human pull request passes by accident.
#   4. Not a draft, and GitHub says `MERGEABLE`.
#   5. The head commit's first parent is this run's commit — the tree `ci`
#      passed.
#   6. This release does not speak a wire PROTOCOL that no PUBLISHED engine
#      speaks — see THE PROTOCOL GATE below. The only guard whose answer can
#      change with nothing in this repository changing, and therefore the only
#      one a re-run of this workflow can clear.
#
# ---------------------------------------------------------------------------
# THE PROTOCOL GATE — THE PHONE DOES NOT RELEASE AHEAD OF THE ENGINE (bl-5b19)
#
# yog mints the wire protocol version; this app, the seat (`lernie`) and the
# foot (`thrall`) each VENDOR a copy of the constant, and the wire is
# fail-closed on a mismatch with no negotiation (yog `docs/REMOTE.md` §3 — the
# authority, and the one place the two-direction rule is written out). The skew
# is two-directional and each direction is gated where it can be decided:
#
#   1. yog publishing a bump ahead of its consumers — held at yog's own release
#      pull request until this repository's `main`, lernie's and thrall's carry
#      the number. That is yog bl-bca2.
#   2. THIS repository releasing a bump ahead of the engine — held by guard 6.
#      thrall took that road first: 0.0.15 published PROTOCOL 16 while the
#      newest published yog, 0.0.49, spoke 15. The phone's landing is worse,
#      because §20's update offer carries a released APK to every device that
#      taps it, and one speaking a number no engine speaks can dial nothing.
#
# **The ordering the two gates produce**: the consumers' mains carry the number
# first, then yog publishes, then the consumers publish. Landing the constant
# on `main` is held by neither — it is what gate 1 waits for.
#
# **Strictly greater, not different.** An app BEHIND the published engine is
# direction 1's defect and its release is the fix; holding that would hold the
# remedy shut. The published engine is yog's newest `v<x.y.z>` tag, cut in the
# same act as its crates.io upload. The decision is
# `scripts/protocol-gate.sh` — pure logic, no network — because this workflow
# cannot run locally; `make protocol-gate` proves it both ways in `lint`.
#
# A verdict line is printed for EVERY open pull request on EVERY run, passing
# or not: a mechanism that merges silently is one nobody can audit, and the run
# log is the only record it keeps. It writes nothing into any pull request body
# or comment — a body cannot be un-published.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read by default; each job that writes says so and says why. Job-level
# `permissions` REPLACE this block rather than adding to it. Every third-party
# action is pinned to a full commit SHA with its tag in the trailing comment: a
# tag is mutable — its owner can repoint `v0.5` at new code between two runs —
# and this workflow is the one that publishes.
permissions:
  contents: read

jobs:
  ci:
    name: CI
    # Owner guard: never runs in a fork. Safe against fork-PR abuse because
    # neither trigger is reachable from a fork — a fork PR fires
    # `pull_request`, which is not requested here, and never a push to this
    # `main` or a dispatch on it, both of which need write access upstream.
    if: github.repository_owner == 'mudbungie'
    # Job-level permissions on a `uses:` job set the ceiling for every job in
    # the called workflow. CI reads the tree and writes nothing back.
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    # Only a direct push to main maintains the release PR — a dispatch is for
    # releasing, not for refreshing a PR.
    if: github.repository_owner == 'mudbungie' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    # Never two release-PR updates at once: they would race on the branch.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # release-plz reads the whole history to decide the next version.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    # THE BUILD GATE, and the whole of it. A failed or skipped `ci` skips this
    # job — the implicit success() in `if` sees to that.
    needs: ci
    if: github.repository_owner == 'mudbungie'
    permissions:
      # To push the `v<version>` tag and cut the GitHub Release.
      contents: write
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    # What `release-apk` needs to know: whether anything was released, and
    # under which tag. Read off the action rather than re-derived from the
    # manifest, because the version that was RELEASED and the version in the
    # manifest are the same fact only when the release actually happened.
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
      releases: ${{ steps.release.outputs.releases }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # The BRANCH, not the run's pinned sha: release-plz resolves the
          # current branch through `@{upstream}`, which fails on a detached
          # HEAD. `ref_name` is `main` for both triggers.
          ref: ${{ github.ref_name }}
      # **THE RELEASE IS CUT HERE AND NOT BY release-plz** (bl-abe9). Its
      # release command begins `let packages = project.publishable_packages()`
      # and answers `nothing to release` when that list is empty;
      # `publishable_packages` filters on cargo metadata's reading of the
      # MANIFEST's `publish` key, so a `publish = false` crate is dropped
      # before any tag, version or config is consulted. `git_only` does not
      # lift it — measured against release-plz 0.3.162 with `git_only` alone,
      # `publish = false` alone, both plus explicit `git_tag_enable` /
      # `git_release_enable`, and a per-package block: all four answer
      # `should release: Yes` and then `nothing to release`. The only lever
      # the tool offers is the manifest key, and that key is the invariant
      # (AGENTS.md rule 6, DESIGN §20: the deliverable is an APK, never a
      # crate). So the version-bump PR stays release-plz's — the half it does
      # correctly — and the tag and the Release are this workflow's own.
      #
      # It writes the two outputs the jobs below already read, in the
      # spelling they already read them in, so nothing downstream moves.
      # Idempotent by the tag: a re-run over a released version answers
      # `false` and cuts nothing, which is what makes a dispatch safe.
      - name: Cut the release when no tag names the manifest's version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ -z "$version" ]; then
            echo "no version in Cargo.toml" >&2
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            echo "releases_created=false" >> "$GITHUB_OUTPUT"
            echo "releases=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The tag is created by this call, at THIS run's commit — the tree
          # `release-apk` then builds from.
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
            --notes "yog-android $version. The APK asset below is the release channel (DESIGN §20)."
          echo "releases_created=true" >> "$GITHUB_OUTPUT"
          printf 'releases=[{"tag":"%s"}]\n' "$tag" >> "$GITHUB_OUTPUT"
          echo "released $tag"

  # The tag exists and the Release is cut; this is what makes either of them
  # useful to a phone.
  read-tag:
    name: read the released tag
    runs-on: ubuntu-latest
    needs: release-plz-release
    if: needs.release-plz-release.outputs.created == 'true'
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Take the tag out of the release job's answer
        id: tag
        env:
          RELEASES: ${{ needs.release-plz-release.outputs.releases }}
        run: |
          set -euo pipefail
          tag="$(jq -r '.[0].tag // empty' <<<"$RELEASES")"
          if [ -z "$tag" ]; then
            echo "the release job said it released something and named no tag" >&2
            echo "$RELEASES" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "released $tag"

  release-apk:
    name: sign and attach the APK
    needs: read-tag
    permissions:
      # To upload the asset onto the release.
      contents: write
    uses: ./.github/workflows/apk.yml
    with:
      # The TAG, so the artifact is built from exactly the tree that was
      # released rather than from whatever `main` has become since.
      ref: ${{ needs.read-tag.outputs.tag }}
      tag: ${{ needs.read-tag.outputs.tag }}
    secrets:
      ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}

  merge-release-pr:
    name: merge the release PR
    runs-on: ubuntu-latest
    # `needs` states the ORDERING and the `if` states the GATE, because the two
    # cannot be one list here: a bare `needs` carries an implicit success(),
    # which skips this job whenever any dependency is SKIPPED — and
    # `release-plz-pr` is push-only, so on a `workflow_dispatch` it always is.
    # That skip closed the one door a held release has (see A DISPATCH IS THE
    # RE-JUDGE DOOR above), so the results are named outright.
    #
    # A red `ci` and a failed or skipped release still skip this job, and so
    # does a FAILED `release-plz-pr`; only its `skipped` — the dispatch case —
    # is admitted. `!cancelled()` is what drops the implicit success(); an `if`
    # with no status function keeps it, which is the trap this comment holds
    # shut. The owner guard used to arrive through `release-plz-pr` as well and
    # is restated here for the same reason.
    needs: [ci, release-plz-pr, release-plz-release]
    if: >-
      ${{ !cancelled()
      && github.repository_owner == 'mudbungie'
      && needs.ci.result == 'success'
      && needs.release-plz-release.result == 'success'
      && (needs.release-plz-pr.result == 'success'
      || needs.release-plz-pr.result == 'skipped') }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # To dispatch this workflow again after the merge. Without it the bump
      # lands on `main` and nothing releases it.
      actions: write
    concurrency:
      group: merge-release-pr
      cancel-in-progress: false
    steps:
      # `scripts/protocol-gate.sh`, and nothing else. From THIS repository's
      # default branch, never from the pull request, whose diff is a version
      # bump and has no business supplying the check that judges it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Judge every open pull request, and merge a green release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          GATED_SHA: ${{ github.sha }}
          # The engine whose published PROTOCOL this release may not exceed
          # (guard 6). Named here rather than in the script because it is the
          # one fact about GitHub in the whole check.
          ENGINE_REPO: mudbungie/yog
        run: |
          set -euo pipefail

          prs="$(gh pr list --state open --limit 50 \
            --json number,headRefName,headRefOid,isDraft,mergeable,mergeStateStatus,author,files)"

          count="$(jq 'length' <<<"$prs")"
          echo "open pull requests: $count"
          if [ "$count" -eq 0 ]; then
            echo "nothing to judge"
            exit 0
          fi

          # One line per pull request: number, head sha, verdict, merge state.
          # Guards 1-4 are decided here so the shell below merges or reports
          # and never re-decides; guard 5 needs an API call and is below.
          verdicts="$(jq -r --arg owner "$OWNER" '
            def bump_files: ["Cargo.toml", "Cargo.lock"];
            .[] | [
              .number,
              .headRefOid,
              (if (.headRefName
                   | test("^release-plz-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$")
                   | not)
                 then "skip: head \(.headRefName) is not a release-plz branch"
               elif (.author.login != "app/github-actions" and .author.login != $owner)
                 then "skip: author \(.author.login) is neither the Actions bot nor the repository owner"
               elif .isDraft
                 then "skip: draft"
               elif ((.files | length) == 0)
                 then "skip: changes no files"
               elif (.files | map(select(.path as $p | bump_files | index($p) | not)) | length) > 0
                 then "skip: touches \(.files | map(.path) | join(" ")), which is not a version bump"
               elif (.mergeable != "MERGEABLE")
                 then "hold: GitHub says mergeable=\(.mergeable)"
               else "candidate" end),
              .mergeStateStatus
            ] | @tsv' <<<"$prs")"

          merged=0
          while IFS=$'\t' read -r number sha verdict state; do
            [ -n "$number" ] || continue
            if [ "$verdict" != "candidate" ]; then
              printf 'PR %s  %s  [merge state %s]\n' "$number" "$verdict" "$state"
              continue
            fi
            # Guard 5: the bump must sit on the commit this run gated. The
            # release PR's own checks never run here, so this identity — not a
            # check — is what ties the merge to a green tree.
            parent="$(gh api "repos/$GH_REPO/commits/$sha" -q '.parents[0].sha')"
            if [ "$parent" != "$GATED_SHA" ]; then
              printf 'PR %s  hold: head sits on %s, not the gated %s  [merge state %s]\n' \
                "$number" "${parent:0:8}" "${GATED_SHA:0:8}" "$state"
              continue
            fi
            # Guard 6: this release may not speak a wire PROTOCOL that no
            # PUBLISHED engine speaks (bl-5b19). yog's release job cuts the
            # `v<x.y.z>` tag in the same act as the crates.io upload, so that
            # tag IS the published engine. Both fetches truncate first and are
            # `|| true`: a missing tag, a tree that states no number or a
            # network fault reads as unreadable and holds rather than merging.
            #
            # ONE path, at the root of both repositories, and the script is its
            # one home (bl-6fec): this used to name yog's Rust path here, and
            # yog moved it in a module split — so the fetch went on succeeding
            # while the read found nothing, and the hold would have become
            # permanent at the next engine publish.
            gate="$(mktemp -d)"
            file="$(scripts/protocol-gate.sh file)"
            raw() {
              gh api "repos/$1/contents/$3?ref=$2" \
                -H "Accept: application/vnd.github.raw" >"$4" || true
            }
            engine_tag="$(gh api "repos/$ENGINE_REPO/releases/latest" -q .tag_name || true)"
            [ -z "$engine_tag" ] || \
              raw "$ENGINE_REPO" "$engine_tag" "$file" "$gate/published"
            raw "$GH_REPO" "$sha" "$file" "$gate/candidate"
            gate_rc=0
            gate_says="$(scripts/protocol-gate.sh judge \
              "$gate/published" "$gate/candidate")" || gate_rc=$?
            printf 'PR %s  protocol gate: %s\n' "$number" "$gate_says"
            if [ "$gate_rc" != 0 ]; then
              printf 'PR %s  held: land the number in yog and let it publish first\n' "$number"
              continue
            fi
            printf 'PR %s  merging: version bump on the gated %s  [merge state %s]\n' \
              "$number" "${GATED_SHA:0:8}" "$state"
            gh pr merge "$number" --merge --delete-branch
            printf 'PR %s  merged\n' "$number"
            merged=$((merged + 1))
          done <<<"$verdicts"

          if [ "$merged" -eq 0 ]; then
            echo "merged nothing; no dispatch"
            exit 0
          fi

          # The merge was GITHUB_TOKEN's, so it created no workflow run at all.
          # This dispatch is the only thing that will release the bump, and it
          # re-runs the whole gate on the merged tree before doing so.
          echo "dispatching release-plz.yml on main to release the merged bump"
          gh workflow run release-plz.yml --ref main

  prune-release-branches:
    name: prune superseded release branches
    # Runs after the release-PR job RAN — succeeded or failed — and after
    # nothing else. `needs` alone would not do it: a bare `needs` carries an
    # implicit `success()`, so a FAILED PR job skips this one, and that is
    # exactly the path that strands a branch. `!cancelled()` is what drops
    # that implicit success; the condition names the two outcomes rather than
    # saying `always()` because a dispatch and a fork both skip the PR job
    # without ever pushing a branch, and this job must stay skipped with them.
    needs: release-plz-pr
    if: >-
      ${{ !cancelled()
      && (needs.release-plz-pr.result == 'success'
      || needs.release-plz-pr.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    # Because this job runs immediately after the PR job, the branch backing
    # the CURRENT release PR is already open — which makes "has no open PR" an
    # exact test for "superseded or orphaned" rather than an age heuristic.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Delete every release-plz-* branch with no open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          open="$(gh pr list --state open --json headRefName -q '.[].headRefName')"
          git ls-remote --heads origin 'refs/heads/release-plz-*' |
            awk '{print $2}' | sed 's#refs/heads/##' |
            while read -r branch; do
              if grep -qxF "$branch" <<<"$open"; then
                echo "keep    $branch (backs an open PR)"
              else
                echo "delete  $branch"
                git push origin --delete "$branch"
              fi
            done
