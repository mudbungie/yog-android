name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI reads the tree and writes nothing back. Every action here is pinned to a
# full commit SHA with its tag in the trailing comment: a tag can be repointed
# at new code by its owner between two runs, a commit SHA cannot (yog's
# bl-5ae6 discipline, adopted from day zero).
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, so leave no credential in .git/config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          # The SHA pin erases the ref name this action reads the toolchain
          # from, so name it; rust-toolchain.toml still pins the build version.
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache cargo-tarpaulin 0.35.2
        id: tarpaulin-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: cargo-tarpaulin-0.35.2-${{ runner.os }}
      - name: Install cargo-tarpaulin 0.35.2
        if: steps.tarpaulin-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin --version 0.35.2 --locked
      - name: Cache cargo-deny 0.20.2
        id: deny-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}
      - name: Install cargo-deny 0.20.2
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked
      # ast-grep 0.44.1 (pinned — sgconfig.yml). `make ci` -> `make lint` runs
      # `make rules-audit`, so ast-grep must be on PATH before `make ci`.
      - name: Cache ast-grep 0.44.1
        id: astgrep-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/ast-grep
          key: ast-grep-0.44.1-${{ runner.os }}
      - name: Install ast-grep 0.44.1
        if: steps.astgrep-cache.outputs.cache-hit != 'true'
        run: cargo install ast-grep --version 0.44.1 --locked
      # `make ci` == `make check`: fmt-check + lint (line-cap + leak-scan +
      # clippy + rules-audit + cargo deny check) + coverage. The lint target
      # folds in the supply-chain and ast-grep audits, so there is no separate
      # CI-only step to drift.
      - run: make ci
      - name: Doctests
        run: cargo test --doc

  # The shell's compile check (bl-c761): the host gate never compiles the
  # cfg(target_os = "android") glue, so this leg cross-clippies it and builds
  # the full APK. Build-only — there is no device on a runner; on-device
  # verification is operator-assisted (DESIGN §3). Gradle is the runner's
  # system gradle and the JDK is the runner's 17 — deliberately no wrapper
  # jar (the leak gate refuses binaries), see the Makefile `apk` target.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
          components: clippy
          # Both APK ABIs — `make apk` cross-builds every one of them, so a
          # single target here would red the leg the moment the Makefile's
          # ABIS default grew its second entry.
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache cargo-ndk 4.1.2
        id: ndk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-${{ runner.os }}
      - name: Install cargo-ndk 4.1.2
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked
      # The NDK pin — the same major the dev boxes carry. sdkmanager is
      # idempotent and the runner image ships the cmdline-tools.
      - name: Install NDK 28.2.13676358
        run: |
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      # One ABI is enough here: what the host gate cannot see is the
      # `target_os = "android"` cfg, and both ABIs share it. A defect that is
      # genuinely x86_64-specific is a compile error the APK build below hits.
      - name: Cross-clippy (the host gate cannot see this cfg)
        run: cargo ndk -t arm64-v8a clippy -- -D warnings
      - name: Build the APK
        run: JAVA_HOME="$JAVA_HOME_17_X64" make apk
