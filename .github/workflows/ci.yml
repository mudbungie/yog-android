name: CI

on:
  # Deliberately NO push arm since bl-7a68. On a push to `main` this workflow
  # still runs, once, as the instance `release-plz.yml` CALLS inside its own
  # run (`uses: ./.github/workflows/ci.yml`, and its release job `needs:` that
  # instance). A push arm here would run these identical jobs a second time per
  # push, at the cost of a full coverage build, for nothing. The consequence:
  # this workflow has no runs of its own on `main`, so anything reading them —
  # a status badge, say — must read `release-plz.yml`.
  pull_request:
  # The reusable entry point. The release gate is `needs: ci` INSIDE the
  # release run rather than a `workflow_run` watching this one from a
  # distance, so what a release ships is a tree this exact run judged.
  workflow_call:
  workflow_dispatch:

# CI reads the tree and writes nothing back. Every action here is pinned to a
# full commit SHA with its tag in the trailing comment: a tag can be repointed
# at new code by its owner between two runs, a commit SHA cannot (yog's
# bl-5ae6 discipline, adopted from day zero).
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, so leave no credential in .git/config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          # The SHA pin erases the ref name this action reads the toolchain
          # from, so name it; rust-toolchain.toml still pins the build version.
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache cargo-tarpaulin 0.35.2
        id: tarpaulin-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: cargo-tarpaulin-0.35.2-${{ runner.os }}
      - name: Install cargo-tarpaulin 0.35.2
        if: steps.tarpaulin-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin --version 0.35.2 --locked
      - name: Cache cargo-deny 0.20.2
        id: deny-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}
      - name: Install cargo-deny 0.20.2
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked
      # ast-grep 0.44.1 (pinned — sgconfig.yml). `make ci` -> `make lint` runs
      # `make rules-audit`, so ast-grep must be on PATH before `make ci`.
      - name: Cache ast-grep 0.44.1
        id: astgrep-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/ast-grep
          key: ast-grep-0.44.1-${{ runner.os }}
      - name: Install ast-grep 0.44.1
        if: steps.astgrep-cache.outputs.cache-hit != 'true'
        run: cargo install ast-grep --version 0.44.1 --locked
      # `make ci` == `make check`: fmt-check + lint (line-cap + leak-scan +
      # clippy + rules-audit + cargo deny check) + coverage. The lint target
      # folds in the supply-chain and ast-grep audits, so there is no separate
      # CI-only step to drift.
      - run: make ci
      - name: Doctests
        run: cargo test --doc

  # The shell's compile check (bl-c761): the host gate never compiles the
  # `cfg(target_os = "android")` glue, so this leg cross-clippies it and builds
  # the full APK. Build-only — there is no device on a runner; on-device
  # verification is operator-assisted (DESIGN §3).
  #
  # **The steps are `apk.yml`'s, not this file's** (bl-7a68). The release path
  # builds the same APK on the same runner with the same NDK pin and the same
  # two ABIs, differing only in that it signs and attaches the result, so how
  # an APK is built on a runner has one home and both callers spend it. No
  # `tag` input here: this leg builds, it does not publish.
  android:
    permissions:
      contents: read
    uses: ./.github/workflows/apk.yml
