plugins { id 'com.android.application' }
android {
    namespace 'dev.yog'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.yog'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // kotlin-bom dedupes the stdlib the two androidx artifacts disagree on.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    // The version android-activity 0.6 vendors its native glue against; do
    // NOT enable prefab (the Rust crate links its own copy of the glue).
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
