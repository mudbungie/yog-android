# **The parity exemption file** (yog docs/PARITY.md §7, bl-fe4c) — every op the
# engine classes `control` that this client does not surface, one line each,
# with the citation that makes the absence a decision rather than an oversight.
#
# The roster is not here: it is `corpus/reply/help.json`, vendored from yog,
# whose rows carry `surface` since protocol 7. This file is only the delta, and
# `src/parity` judges the two against the `act:` tags a `make screens` walk
# actually observed. Four assertions, and two of them keep THIS file honest —
# a line for an op that is now surfaced fails (stale), and a line naming an op
# the roster no longer classes `control` fails (rotted). Deleting a line
# re-reddens the gate and changes no code.
#
# **This file is where DESIGN §13.4's hand-kept ledger went.** That ledger was
# prose, and prose cannot rot loudly: it filed conversation search under
# "upstream asks — the wire does not carry the fact" while the engine's roster
# carried `search` all along, and the board had corrected itself a day
# earlier (bl-4c2b) while the paragraph went on asserting the opposite.
#
# The two group reasons are the conformance decision table's own words
# (`tests/conformance/expect.rs`), because they are the same decision seen from
# the other side: that table says what this codec may not misread, this file
# says what a thumb cannot reach. A shape absent from both is one decision, and
# it keeps one wording.

# --- Reads outside the chat-loop slice (DESIGN §2) --------------------------
