# **The parity exemption file** (yog docs/PARITY.md §7, bl-fe4c) — every op the
# engine classes `control` that this client does not surface, one line each,
# with the citation that makes the absence a decision rather than an oversight.
#
# The roster is not here: it is `corpus/reply/help.json`, vendored from yog,
# whose rows carry `surface` since protocol 7. This file is only the delta, and
# `src/parity` judges the two against the `act:` tags a `make screens` walk
# actually observed. Four assertions, and two of them keep THIS file honest —
# a line for an op that is now surfaced fails (stale), and a line naming an op
# the roster no longer classes `control` fails (rotted). Deleting a line
# re-reddens the gate and changes no code.
#
# **This file is where DESIGN §13.4's hand-kept ledger went**, and since the
# full-seat re-scope (bl-eac2, DESIGN §16.2) every line is one of two kinds:
# UNBUILT, citing the ball that builds the surface and deletes the line, or a
# structural reason that survives the full-seat ruling. The chat-loop-slice
# group reason (DESIGN §2) is retired and may not be cited again — a scope
# fence is not a reason once the operator has ruled the phone a full seat.
# The conformance decision table (`tests/conformance/expect.rs`) still records
# its §2 constants and stays correct: this codec spells none of these shapes
# yet, and each ball below moves exactly its own rows when it lands.

# --- The conversation act group is whole (bl-f97c, bl-99fd) -----------------
# Nothing of it is on this ledger. bl-f97c landed three of the four on the
# conversation row's long-press menu (DESIGN §13.5); `fork` did not go with
# them, because its `from` is a fork point and the engine's own
# `fork::Attempt` says "Empty is not a value". bl-99fd built the surface that
# names one — the operable notches of the spine and the workspace's
# `config/<name>` heads, both already read by the records screen — so the act
# hangs on that screen's foot, addressed at a picked point (DESIGN §13.16).

# The held tool call's three — answer, revoke, restore — were here, and are
# gone: the capability band answers the parked call on the transcript screen
# and the floor pair rides the row menu (DESIGN §13.7, bl-b39d).

# --- Work review from the glass is whole (bl-5a56) --------------------------
# Nothing of it is on this ledger. `files` has a screen of its own one depth
# behind the transcript, beside the records entry, because it names the
# CONVERSATION; `work-diff` has one on the workspace's aimed band, because it
# names the workspace. Each is one question at two depths, and the row that
# asks the deeper one carries the same op's tag (DESIGN §13.15).

# --- The conversation's machinery is whole (bl-146b) ------------------------
# Nothing of it is on this ledger. The records screen carries all six: five on
# the control that opens it — opening IS the ask — and `step` on the foot of
# the screen it opens, addressed at the census row under the thumb (DESIGN
# §13.11).

# --- The ball pane is whole (bl-d587 read, bl-f36e act) ---------------------
# Nothing of it is on this ledger. bl-d587 landed the three reads — one control
# apiece, each where its subject is — and bl-f36e landed the five acts on the
# foot of the aimed view, where the `--as` stamp the wire wants IS the pane's
# own workspace (DESIGN §13.9).

# --- The candidate surfaces are whole (bl-2f17) -----------------------------
# Nothing of them is on this ledger. The candidates screen carries all four:
# `science` on the control that opens it — opening IS the ask — and the three
# acts on its foot, each live exactly where the picked row is its subject
# (DESIGN §13.12).

# --- Fleet and watch are whole (bl-477e) ------------------------------------
# Nothing of them is on this ledger. The fleet screen carries all four — the
# two that start something over the two that stop it — and it reads nothing at
# all, because what a loop is DOING is on the board and one fact has one home
# (DESIGN §13.13).

# The trail and the queue were here — `ops`, `ack`, `clear-trail` and
# `attention` — and are gone: the roster's two world entries reach both
# surfaces, the trail carries the acknowledgement and the armed truncation, and
# the queue is the attention lane's, held standing from the first pass (DESIGN
# §13.8, §14.1).

# --- The admin surface is whole (bl-f645) -----------------------------------
# Nothing of it is on this ledger. The admin screen carries four of the five on
# the workspace's aimed band — `config` on the destination controls that read
# it and on the write beside them, `marks` in both halves, `scan`, and
# `delete-workspace` as an ENABLEMENT the wire's own `typed` defines — and
# `delete-agent` is on the records screen's foot, where the conversation it
# unmakes is the subject, armed by two taps because its `typed` is a parameter
# rather than an arming (DESIGN §13.17).

# --- Roster and discovery are whole (bl-3685) -------------------------------
# Nothing of them is on this ledger. `clients` has a screen of its own on the
# workspace's aimed band, `lineages` rides the records screen's read because
# what it names is what `governing`'s `follows` is one of, and `help` is a
# screen over the table this repository already vendors — surfaced here and
# never asked for on the wire, which `tests/conformance/requests.rs` records
# (DESIGN §13.14).

# --- The minting seat is whole (bl-2ee8) ------------------------------------
# Nothing of it is on this ledger. `enroll` is two controls on the admin
# screen's foot — one per §4.2 grade, because the grade is which of two devices
# is being made rather than a setting — and what the mint answers covers that
# screen as a symbol the next device photographs, with a back control whose
# whole product is the forgetting (DESIGN §13.18, amending §11).

# --- Sign-in from the glass is whole (bl-5a41) ------------------------------
# Nothing of it is on this ledger. Both are on the sign-in screen, the seventh
# aimed entry: `login` on each provider row's own button, because the row IS
# the subject, and `login-tail` on the row itself, because tapping it is what
# opens the run's tail. The tail is a THIRD held lane (§14.1) beside the queue
# and the follow, and its stop condition is the run settling (DESIGN §13.19).

