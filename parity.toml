# **The parity exemption file** (yog docs/PARITY.md §7, bl-fe4c) — every op the
# engine classes `control` that this client does not surface, one line each,
# with the citation that makes the absence a decision rather than an oversight.
#
# The roster is not here: it is `corpus/reply/help.json`, vendored from yog,
# whose rows carry `surface` since protocol 7. This file is only the delta, and
# `src/parity` judges the two against the `act:` tags a `make screens` walk
# actually observed. Four assertions, and two of them keep THIS file honest —
# a line for an op that is now surfaced fails (stale), and a line naming an op
# the roster no longer classes `control` fails (rotted). Deleting a line
# re-reddens the gate and changes no code.
#
# **This file is where DESIGN §13.4's hand-kept ledger went**, and since the
# full-seat re-scope (bl-eac2, DESIGN §16.2) every line is one of two kinds:
# UNBUILT, citing the ball that builds the surface and deletes the line, or a
# structural reason that survives the full-seat ruling. The chat-loop-slice
# group reason (DESIGN §2) is retired and may not be cited again — a scope
# fence is not a reason once the operator has ruled the phone a full seat.
# The conformance decision table (`tests/conformance/expect.rs`) still records
# its §2 constants and stays correct: this codec spells none of these shapes
# yet, and each ball below moves exactly its own rows when it lands.

# --- Unbuilt: the fourth conversation act (bl-99fd) -------------------------
# bl-f97c landed three of this group's four on the conversation row's
# long-press menu (DESIGN §13.5) and deleted their lines. `fork` did not go
# with them, and the reason is a missing READ rather than a missing surface:
# its `from` is a fork point — a commit of the conversation's own history, or a
# `config/<name>` head — and the engine's own `fork::Attempt` says "Empty is
# not a value". The marks and the tip ride the `agent` read (bl-146b) and the
# lineage names ride `lineages` (bl-3685), both unbuilt, so a menu item for it
# could not fire. A free-text field where an operator types a commit sha on a
# phone is not the surface; it is this app asking the operator to be the read
# §8 forbids it to derive.
fork = "unbuilt: its fork point is a ref no read here names — the picking surface is bl-99fd (DESIGN §13.5)"

