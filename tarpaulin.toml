# Repo-wide tarpaulin defaults: applied by every `cargo tarpaulin` run,
# including the pre-commit hook and CI.
#
# Pinned tarpaulin version: 0.35.2 (same pin as yog and lernie). 0.35.3 was
# yanked, and 0.35.4+ silently excludes inline `#[cfg(test)] mod tests;` files
# from the coverable denominator. The 100% floor only means the same thing on
# every machine if everyone is on the same tarpaulin — upgrade in lockstep
# (this file + the Makefile preflight) or the floor gets quietly weaker on
# whichever side moves first.
#
# Two classes of `exclude-files` entry, each with its reasoning:
#
# `rules/fixtures/*.rs` is the ast-grep violation corpus — deliberately
# non-compiling, never part of the crate (nothing declares it as a module),
# but tarpaulin analyzes loose .rs files it can parse and would count it as
# 0-covered denominator. yog dodges the same hazard only because its fixture
# happens not to parse; excluding it by name is the honest spelling.
#
# The named `src/shell/` files are the Android platform glue (bl-c761)
# — `cfg(target_os = "android")`, never compiled by the host suite, so no
# host test can reach a line of them; CI's android leg is their compile
# check, and on-device verification is operator-assisted (DESIGN §3). Named
# file by file rather than `src/shell/*` because the shell also holds
# host-testable pure code — `src/shell/span.rs` (the UTF-16 span math) and
# `src/shell/place.rs` (where an opened list is allowed to paint, bl-78c2) —
# that stays UNDER the 100% floor. `src/shell/controls/drop.rs` is the
# android half of that second pair and is named here for the usual reason:
# it is egui `Popup` and `Frame` calls, while the RULE it spends — which side
# of a control a list opens on, and how tall it may be — is `place.rs`, which
# is pure and asserted. The seam is drawn exactly there because this class of
# defect (a control painting into the gesture-nav dead zone) had been fixed
# twice with nothing but prose to hold it, and came back a third time. `src/tools/ui/bridge.rs` is the same class and
# is named for the same reason: it is the JNI call itself, and the seam is
# drawn so everything up to it — the schemas, the argument reading, the
# two-line answer protocol — stays testable without a device. `src/shell/jvm.rs`
# `src/tools/paper/bridge.rs` is the third of that class (bl-f34f) and is
# there for the same reason: it is four static calls into `dev.yog.Paper`,
# while the schemas, the argument reading and the two-line protocol its
# answers arrive in (`src/tools/bridged.rs`) are pure and stay UNDER the
# floor. `src/tools/sighted/bridge.rs` is the same two calls into
# `dev.yog.Sighted` (bl-b0a9), and `src/tools/bridged/door.rs` is the call
# ITSELF, factored out of the paper bridge when the sighted pair became the
# second door: it attaches to the JVM and resolves a class, so no host test
# can reach a line of it, while the protocol beside it in `bridged.rs` stays
# pure and under the floor. `src/tools/shade/bridge.rs` is the one call into
# `dev.yog.Shade` (bl-5cbd), the same class again: the shade itself is a
# platform read, while the advertised element, the cap reading and the
# refusal a build with no device gives stay pure and under the floor. `src/shell/jvm.rs`
# is that same JNI call, factored out when the camera became its second caller
# (bl-d815), and `src/shell/camera.rs` is the camera's own half of it; the scan
# screen (`src/shell/enroll/scan.rs`) is egui glue over both, while the decode
# and the bridge vocabulary it spends live in `src/scan.rs`, which is pure and
# stays UNDER the floor — an exclusion is added with its reasoning,
# never to make a number, and never wider than the reasoning covers.
# `src/shell/controls/held.rs` is the capability band (bl-b39d), the same class
# again: three `ui.button` calls under a weak label, `cfg(target_os =
# "android")` to the last line. Everything it decides is elsewhere and under
# the floor — WHETHER a call is parked and WHICH one is `codec::queue::held_at`,
# the three verdicts and their words are `codec::hold`, and what an answer's
# receipt means is `seat::acts::held` — all asserted by host tests. What is left
# here is which widget shows which of them.
#
# `src/shell/screens/search.rs` is the search field and the screen its answer
# opens (bl-4c2b), the same class again: a `TextEdit`, a `Button` and a list of
# taps, `cfg(target_os = "android")` to the last line. Everything it decides is
# somewhere else and under the floor — WHAT a hit is and how it reads back is
# `codec::search`, and WHEN an answer stands (the empty needle that crosses no
# wire, the engine's own empty-needle answer) is `seat::asks::search`, both
# asserted by host tests. What is left here is which widget shows which of them.
#
# `src/shell/screens/rows.rs` is the conversation list split out of
# `screens.rs` (bl-f97c) and inherits its class exactly: egui `Popup` and
# `Button` calls, `cfg(target_os = "android")` to the last line. The seam it
# is drawn on is the one that already existed — the menu's PLACEMENT is
# `place.rs`, which is pure and asserted, and the menu's ROSTER is
# `codec::row`'s three readings (`op`, `wants`, `with`), which are pure and
# asserted too. What is left here is which widget gets which of them.
#
# `src/shell/screens/world/balls.rs` is the ball pane (bl-d587), the same class
# again and named for the same reason: a `ScrollArea` of labels and one entry
# control, `cfg(target_os = "android")` to the last line. Everything it decides
# is somewhere else and under the floor — WHAT a ball row says and what an
# absent figure means is `codec::balls`, WHICH read a view asks and what a
# focus-less aimed read earns is `seat::asks::balls`, and the pairing that
# makes one view's answer unpaintable under another is `Pane::view`, all
# asserted by host tests. What is left here is which widget shows which of them.
#
# `src/shell/screens/world.rs` and its two children (`world/waiting.rs`,
# `world/trail.rs`) are the trail and the attention queue (bl-35bd), the same
# class again: a `ScrollArea` of labels, two `ui.button` calls and the taps
# that open them, `cfg(target_os = "android")` to the last line. Everything
# they decide is somewhere else and under the floor — WHAT a trail row says is
# `codec::trail`, WHAT a queue row says is `codec::queue`, how an age is
# spelled is `roster::ago`, and WHICH gesture each control fires is
# `seat::asks`/`seat::acts::trail`, all asserted by host tests. What is left
# here is which widget shows which of them, and the arm — one bool the walk
# observes as a painted label.
#
# `src/shell/screens/records.rs` and `records/parts.rs` are the records screen
# (bl-146b), the same class again: a `ScrollArea` of labels, one enabled-or-not
# button and the taps around them, `cfg(target_os = "android")` to the last
# line. Everything they decide is somewhere else and under the floor — WHAT
# each of the six shapes says and what it declines to decode is
# `codec::records`, WHICH reads an opening asks and what a focus-less one earns
# is `seat::asks::records`, and the pairing that makes one conversation's
# records unpaintable under another is `Records::about`, all asserted by host
# tests. What is left here is which widget shows which of them.
#
# `src/shell/screens/world/admin/minted.rs` is the minted material's covering
# surface (bl-2ee8), the same class again: a bar, three labels and one egui
# `Mesh`, `cfg(target_os = "android")` to the last line. Everything it decides
# is somewhere else and under the floor — WHAT the symbol's modules are and how
# big one is painted is `crate::symbol` (pure, and proved by a round trip
# through the decoder this app already links), WHAT the envelope says is
# `crate::envelope`, and WHERE the material lives and when it is dropped is
# `seat::pass`/`worker::after`, all asserted by host tests.
#
# `src/shell/screens/world/admin.rs` and `admin/acts.rs` are the admin screen
# (bl-f645), the same class again: a list of destination controls, four
# buttons and a multi-line field, `cfg(target_os = "android")` to the last
# line. Everything they decide is somewhere else and under the floor — WHICH
# destinations this seat spells and what a frame naming another earns is
# `codec::admin`, WHICH word each act takes is `AdminAct::wants`, what each
# receipt MEANS and the read that settles a lost one is `seat::acts::admin`,
# and the pairing that makes one workspace's mark unpaintable under another is
# `Marks::about` — all asserted by host tests. What is left here is which
# widget shows which of them, and the seed — one comparison the walk observes
# as a field with a file in it.
#
# `src/shell/screens/records/points.rs` and `records/acts.rs` are the fork
# picking surface and the foot over it (bl-99fd), the same class again: two
# buttons, a field and a list of picking controls, `cfg(target_os = "android")`
# to the last line. Everything they decide is somewhere else and under the
# floor — WHICH notch is reachable and in which spelling is
# `codec::records::spine`, WHAT a fork sends and what it refuses to send is
# `codec::fork`, and the pairing that puts an anchored policy under the notch
# it was asked at is `seat::asks::records` and `worker::fold` — all asserted by
# host tests.
#
# `src/shell/screens/world/candidates.rs` and `candidates/acts.rs` are the
# candidates screen (bl-2f17), the same class again: a `ScrollArea` of labels,
# five buttons and a stepper, `cfg(target_os = "android")` to the last line.
# Everything they decide is somewhere else and under the floor — WHAT an
# attempt row says and which act its handle earns is `codec::candidates`, WHAT
# a fan actually does (stage, spread, fire each) is `seat::acts::candidate`,
# and the pairing that makes one workspace's listing unpaintable under another
# is `Spread::about`, all asserted by host tests. What is left here is which
# widget shows which of them, and the count — a number the control floors and
# the codec does not.
#
# `src/shell/screens/world/fleet.rs` is the fleet screen (bl-477e), the same
# class again: four buttons, a stepper and a field, `cfg(target_os =
# "android")` to the last line. Everything it decides is somewhere else and
# under the floor — WHAT each of the four spells, which word it takes, and what
# the one shared receipt MEANS when read against the op that earned it are all
# `codec::fleet`, and the sentence a receipt earns is `seat::acts::fleet`, both
# asserted by host tests. What is left here is which widget shows which of
# them, and the cap — a number the control floors.
#
# `src/shell/screens/world/clients.rs` and `world/help.rs` are the machines
# roster and the op table (bl-3685), the same class again: a `ScrollArea` of
# labels apiece and no control at all, `cfg(target_os = "android")` to the last
# line. Everything they decide is somewhere else and under the floor — WHAT a
# machine row says and what its two lifetimes mean is `codec::clients`, WHAT
# the op table holds and how it refuses a malformed one is `crate::help`, and
# the pairing that makes one workspace's roster unpaintable under another is
# `Machines::about`, all asserted by host tests.
#
# `src/shell/screens/files.rs`, `screens/preview.rs` and
# `screens/world/work.rs` are the work-review surfaces (bl-5a56), the same
# class again: two `ScrollArea`s of labels and buttons and one monospace fence,
# `cfg(target_os = "android")` to the last line. Everything they decide is
# somewhere else and under the floor — WHAT a listing says and what an absent
# worktree means is `codec::files`, WHAT a diff row says and which fields its
# state decides is `codec::workdiff`, WHICH parameter each depth's ask carries
# and how it is paired back to its row is `seat::asks::review`, and the pairing
# that makes one conversation's listing unpaintable under another is
# `Files::about`/`Work::about` — all asserted by host tests. What is left here
# is which widget shows which of them.
#
# `src/shell/screens/world/signin.rs` is the sign-in screen (bl-5a41), the same
# class again: a `ScrollArea` of provider rows, two buttons apiece and the tail
# under the one being followed, `cfg(target_os = "android")` to the last line.
# Everything it decides is somewhere else and under the floor — WHAT a frame
# carries and how frames fold is `codec::login`, WHICH lane stands and when it
# stops is `seat::pass::login`, what the act's receipt MEANS and the read that
# settles a lost one is `seat::acts::login`, and the pairing that makes one
# provider's flow unpaintable under another's name is `Signing::about` — all
# asserted by host tests. What is left here is which widget shows which of
# them.
#
# `src/shell/app/fields.rs` is the three `Field` constants split out of
# `app.rs` (bl-5a56) and inherits its entry exactly: it is `cfg(target_os =
# "android")` data with no behaviour at all.
#
# `ignore-panics` excludes branches that only fire on programmer-error panics.
[default]
exclude-files = [
    "rules/fixtures/*",
    "src/shell/act.rs",
    "src/shell/app.rs",
    "src/shell/back.rs",
    "src/shell/app/fields.rs",
    "src/shell/app/pass.rs",
    "src/shell/app/probe.rs",
    "src/shell/boot.rs",
    "src/shell/camera.rs",
    "src/shell/bridge.rs",
    "src/shell/chat.rs",
    "src/shell/composer.rs",
    "src/shell/controls.rs",
    "src/shell/controls/drop.rs",
    "src/shell/controls/held.rs",
    "src/shell/controls/pick.rs",
    "src/shell/controls/tune.rs",
    "src/shell/enroll.rs",
    "src/shell/mark.rs",
    "src/shell/enroll/material.rs",
    "src/shell/enroll/scan.rs",
    "src/shell/inset.rs",
    "src/shell/jvm.rs",
    "src/shell/screens.rs",
    "src/shell/screens/files.rs",
    "src/shell/screens/preview.rs",
    "src/shell/screens/records.rs",
    "src/shell/screens/records/acts.rs",
    "src/shell/screens/records/points.rs",
    "src/shell/screens/records/parts.rs",
    "src/shell/screens/rows.rs",
    "src/shell/screens/search.rs",
    "src/shell/screens/world.rs",
    "src/shell/screens/world/admin.rs",
    "src/shell/screens/world/admin/acts.rs",
    "src/shell/screens/world/admin/minted.rs",
    "src/shell/screens/world/balls.rs",
    "src/shell/screens/world/candidates.rs",
    "src/shell/screens/world/candidates/acts.rs",
    "src/shell/screens/world/clients.rs",
    "src/shell/screens/world/work.rs",
    "src/shell/screens/world/fleet.rs",
    "src/shell/screens/world/help.rs",
    "src/shell/screens/world/signin.rs",
    "src/shell/screens/world/trail.rs",
    "src/shell/screens/world/waiting.rs",
    "src/shell/transcript.rs",
    "src/shell/sys.rs",
    "src/tools/bridged/door.rs",
    "src/tools/paper/bridge.rs",
    "src/tools/shade/bridge.rs",
    "src/tools/sighted/bridge.rs",
    "src/tools/ui/bridge.rs",
]
ignore-panics = true
timeout = "300s"
