CONFIG_FEATURE_PREFER_APPLETS
CONFIG_LONG_OPTS
CONFIG_DESKTOP
CONFIG_WGET
CONFIG_FEATURE_WGET_LONG_OPTIONS
CONFIG_FEATURE_WGET_STATUSBAR
