# **Which busybox applets this app packages** — one kconfig symbol per line,
# flipped in `.config` by `scripts/natives.sh` after `allnoconfig`, so the
# binary carries exactly this set and nothing else. Two things follow from
# that and both are deliberate: the build is small (an applet not named here
# is not compiled, which is also why a full `defconfig` — whose password,
# login and mount applets do not build against bionic at all — is not what
# this uses), and the advertised list in the shell tool's description is a
# statement about THIS file.
#
# There is no TLS here on purpose. `CONFIG_FEATURE_WGET_HTTPS` is busybox's
# own small TLS, and it does not verify certificates; shipping an unverifying
# https client beside a curl that verifies would be a decoy. `busybox wget`
# is plaintext http, `curl` is the one that does TLS, and the tool document
# says so.
