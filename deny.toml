# cargo-deny supply-chain policy for yog-android.
#
# Verified against cargo-deny 0.20.2 (CI pins this exact version). The license
# allow-list is empirically derived from `cargo deny list` over the committed
# Cargo.lock — every license that actually appears in the tree, nothing
# speculative. Today the graph is the crate itself (zero dependencies), so the
# list is one entry. Re-run `cargo deny check` after any dependency change and
# fix drift here by config, never by patching dependencies.

[advisories]
# Reject crates whose published version has been yanked from the registry.
yanked = "deny"
# An entry lands here only with a reason recorded beside it, and an entry
# that stops matching any crate is a warning telling you to drop it.
ignore = [
    # ttf-parser: unmaintained (author's statement), no fix shipped. It is
    # egui's own font-parsing substrate (ab_glyph -> owned_ttf_parser ->
    # ttf-parser), reachable only through the pinned eframe 0.36 — replacing
    # it is upstream egui's migration, not a choice this manifest can make.
    # Drop this entry when an eframe release moves off it.
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "MIT",
    # The rustls/ring tree (bl-48d9, the operator-approved TLS set).
    # serde_json's subtree is dual MIT-or-Apache and rides on the MIT arm;
    # ring is "Apache-2.0 AND ISC", so both of its arms must be allowed.
    "Apache-2.0",    # ring (AND-arm)
    "ISC",           # ring (AND-arm), rustls-webpki, untrusted
    "BSD-3-Clause",  # subtle
    # The eframe 0.36 tree (bl-c761, the operator-approved shell set) —
    # empirical over the lockfile, one crate class per line, like the rest.
    "BSD-2-Clause",     # arrayref (via blake3, wgpu's shader hashing)
    "BSL-1.0",          # clipboard-win, error-code (egui's clipboard glue)
    "Zlib",             # slotmap, foldhash (egui's containers)
    "Unicode-3.0",      # unicode-ident (AND-arm beside MIT-or-Apache)
    "OFL-1.1",          # epaint_default_fonts (AND-arm: the embedded fonts)
    "Ubuntu-font-1.0",  # epaint_default_fonts (AND-arm: the Ubuntu face)
]

[bans]
# Duplicate versions are informational; a bare "*" version requirement is a
# hard error.
multiple-versions = "warn"
wildcards = "deny"
# TLS stack ban, rustls-only (Rust Bootstrap v3 rule 6, and yog's amended
# adaptation verbatim). The client's mTLS transport will be rustls with
# `default-features = false` and `ring` — rustls' defaults select `aws-lc-rs`,
# whose `aws-lc-sys` builds C, and a manifest edit that dropped the flag would
# pull a C toolchain back in silently. Banning the three sys/bridge crates
# makes that edit fail HERE instead. All three match nothing today, by design:
# the ban predates the dependency so the first TLS ball cannot get it wrong.
deny = [
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    { crate = "aws-lc-sys" },
]

[sources]
# Every crate must come from a known registry (crates.io) — no unvetted
# registries and no ad-hoc git sources. There is no `allow-git` list, and
# nothing goes on one; a `path` dependency is never lawful (yog AGENTS.md rule
# 6, which governs this repo's dependency posture too).
