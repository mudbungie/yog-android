[package]
name = "yog-android"
version = "0.0.0"
edition = "2024"
description = "Android seat for yog: a wire client of the remote boundary"
license = "MIT"
repository = "https://github.com/mudbungie/yog-android"
readme = "README.md"
# NOT PUBLISHED, structurally. The deliverable is an APK, not a crate, so
# `publish = false` makes an accidental `cargo publish` impossible rather than
# merely gated — yog's 0.0.1 lesson is that a registry publication cannot be
# recalled (a yanked version stays downloadable). If this crate ever ships to
# a registry, that is a deliberate operator decision that replaces this line
# AND adds an `include` allowlist audited via `cargo package --list`.
publish = false

[lib]
name = "yog_android"
path = "src/lib.rs"
# `cdylib` is the Android deliverable: `make apk` builds `libyog_android.so`
# via cargo-ndk and the Gradle shell loads it (`android.app.lib_name`). `rlib`
# stays so the host test suite and a future integration crate keep linking the
# ordinary way.
crate-type = ["rlib", "cdylib"]

[dependencies]
# Each entry names its approval. Zero new dependencies without one.
# serde_json: operator ruling 2026-08-23 (bl-fe33) — the codec's parse
# substrate, matching the server's own framing dependency. serde *derive*
# stays a non-dependency: the codec is hand-written strict decode.
serde_json = "1"
# rustls: operator ruling 2026-08-23 (bl-48d9) — the REMOTE §1.3 channel, and
# no hand-rolled crypto. `default-features = false` with `ring` is
# load-bearing: rustls' defaults select aws-lc-rs, whose aws-lc-sys builds C;
# deny.toml bans that sys crate so a manifest edit dropping this flag fails
# the gate instead of quietly re-acquiring a C toolchain. Feature set mirrors
# the server's own rustls line exactly.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# rxing: operator ruling 2026-08-30 (bl-d815) — the QR decoder behind **Scan
# QR** on the enrollment screen. The ruling is a choice between three routes,
# and it is recorded here because the manifest is where the cost lands:
#
#   * ML Kit barcode scanning was REFUSED. It is not "the platform route" —
#     it is Google Play Services, a Gradle dependency tree this repo has
#     never had, several MB of bundled model in the APK, and absent on a
#     device without Play Services. It also brings CameraX with it.
#   * A from-scratch decoder was refused: a Reed-Solomon decode behind a
#     binarizer, a finder-pattern locate and a perspective unwarp is new code
#     this repo maintains forever, under the 100% floor, for a format with
#     three mature implementations.
#   * `rxing` — the Rust port of ZXing — puts the decoder in the Rust core,
#     which is the ONE place this repo's gate can judge a dependency:
#     cargo-deny reads its licenses, advisories, sources and bans, and the
#     Gradle side has no equivalent gate at all. Apache-2.0, already on the
#     allow-list for ring's own AND-arm; the tree it adds is pure Rust
#     (chrono, num, once_cell, regex, thiserror, unicode-segmentation,
#     encoding_rs, codepage-437) with no C toolchain and no new license.
#
# The feature set is the smallest one that DECODES, and each flag is
# load-bearing. `qrcode` + `decoders` is the reader; `encoding_rs` is not
# optional in practice — rxing's only other character-set arm,
# `no_character_set_support`, compiles `CharacterSet::decode` to
# `unimplemented!()`, which is the panic path AGENTS.md rule 4 forbids and
# which byte-mode QR content reaches on every decode. Everything else is off:
# no `image`/`image_formats` (the frame arrives as a luminance buffer from
# the camera, never as a file), no `encoders` (this app reads symbols and
# never draws one — minting is the operator seat's job, REMOTE §8.4), and no
# other symbology.
rxing = { version = "0.9", default-features = false, features = ["qrcode", "decoders", "encoding_rs"] }

# The shell set (operator ruling 2026-08-23, recorded on bl-c761: eframe,
# winit, jni, log, android_logger — the versions the bl-8d03/bl-014e spikes
# proved on glass). Target-gated so the host gate (clippy, tarpaulin, the
# whole 100%-floor suite) never compiles the paint stack: the shell is
# Android-only glue, excluded from coverage with its reasoning in
# tarpaulin.toml, and CI's android leg is its compile check.
[target.'cfg(target_os = "android")'.dependencies]
# eframe: the ruled UI stack (DESIGN §3, O1/bl-8d03). `android-game-activity`
# and NEVER `android-native-activity` — the two backends conflict, and
# GameActivity is what gives the IME a real InputConnection (bl-014e).
eframe = { version = "0.36", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "android-game-activity",
] }
# **NOT `accesskit`, and the reason is a crash** (bl-fe4c, DESIGN §15.1). The
# ruling for the parity gate preferred exporting egui's accessibility tree to
# the platform, and the route was walked: eframe's `accesskit` feature plus the
# `accesskit_winit` dependency that actually selects the android adapter (the
# feature alone is a no-op — it falls through to a null adapter). It works
# until an accessibility client attaches, and then the process ABORTS:
# `accesskit_android` `event.rs:64` unwraps the JNI call
# `getParent().requestSendAccessibilityEvent(..)` while raising its first
# event, the call returns a JavaException under GameActivity's surface view,
# and the unwrap is a `SIGABRT` (measured on the emulator; the same lines stand
# in the newest release). That is every TalkBack user's app dying, not a test
# inconvenience, so the dependency is out and the gate reads the debug-gated
# fallback inventory instead. bl-a6f3 is the exit ball: put this back when
# upstream stops unwrapping.
# winit: eframe's own windowing layer, named directly for the AndroidApp
# handle type and the activity input types the bridge speaks.
winit = { version = "0.30", features = ["android-game-activity"] }
# ndk-context: the process JavaVM the tool-host worker reaches the interface
# service through — it holds no activity handle and must not (bl-1511).
ndk-context = "0.1"
# jni: the IME-inset probe (DESIGN §3 finding 2) — SDK 35 is forced
# edge-to-edge and the keyboard inset is only readable via WindowInsets.
jni = "0.21"
# log/android_logger: logcat is the only stdout an APK has.
log = "0.4"
android_logger = "0.15"

[lints.rust]
warnings = "deny"
# `unsafe` is confined, not forbidden (the bl-c761 relaxation AGENTS.md rule 3
# anticipated): the shell's JNI probe needs raw-pointer conversions and the
# process entry needs `unsafe(no_mangle)` + a pre-boot `set_var`. The
# confinement is `rules/unsafe-outside-sys.yml` — every unsafe block, fn and
# attribute lives in src/shell/sys.rs, where the soundness argument is written.
unsafe_code = "allow"

# Clippy gate. `pedantic` runs at deny with priority -1 so the specific allows
# below (default priority 0) override the group. The allow-list is sanctioned
# and each entry justified; NEVER inline `#[allow]` — the no-lint-suppression
# ast-grep rule forbids it, this manifest is the only home for a suppression.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }

# Bootstrap five (Rust Bootstrap v3): owned signatures and self-describing
# errors are house style; the doc/must_use nags are advisory only.
needless_pass_by_value = "allow"   # owned params are a deliberate rule, not an oversight
module_name_repetitions = "allow"  # module-qualified type names read clearer than terse ones
missing_errors_doc = "allow"       # error enums are self-descriptive; no prose to duplicate
missing_panics_doc = "allow"       # prod is panic-free (restriction lints below) — nothing to note
must_use_candidate = "allow"       # advisory; not decorating every getter with #[must_use]

# Site-specific, each genuinely wrong for this code.
cast_possible_truncation = "allow" # the frame header's len-as-u32 is bounded by MAX_FRAME before the cast (src/frame.rs); a try_from there is an untestable error arm
cast_precision_loss = "allow"      # the shell's JNI inset pixels (i32, bounded by screen geometry far below f32's 24-bit integer range) cross into egui's f32 point space
cast_sign_loss = "allow"           # the icon hue drive clamps every channel to 0.0..=255.0 before its f32-to-u8 cast (src/icon.rs); a clamped channel has no sign to lose, and a try_from there is an untestable error arm
struct_excessive_bools = "allow"   # ConvRow mirrors the server row: its four bools are orthogonal, independently-written wire facts (yog's own manifest carries the same allow for the same shape)

# Restriction lints: prod code is panic-free and bounds-checked. These deny
# the panic family (unwrap/expect/panic!/todo!/unimplemented!), leftover
# `dbg!`, and unchecked indexing/string slicing. The gate (`clippy
# --all-targets -- -D warnings`) picks them up; the test carve-outs live in
# clippy.toml (allow-*-in-tests). Locks use
# `unwrap_or_else(PoisonError::into_inner)`; fallible reads use `.get()`/`?`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
